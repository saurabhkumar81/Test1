<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      color: #d4d4d4;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 4px;
      margin-bottom: 1.5rem;
      color: #f0f0f0;
      text-transform: uppercase;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.6rem;
      color: #888;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      width: 110px;
      height: 110px;
      background: #141414;
      border-radius: 12px;
      border: 2px solid #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #1f1f1f;
      border-color: #444;
      transform: scale(1.05);
    }

    .cell.taken { cursor: default; }

    .cell.x { color: #ff6b6b; }
    .cell.o { color: #74c0fc; }

    .cell.win {
      background: #1a1a1a;
      border-color: #ffd43b;
      animation: pulse 0.5s ease-in-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    #restart {
      margin-top: 2rem;
      padding: 0.7rem 2.5rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: #1f1f1f;
      color: #d4d4d4;
      border: 1px solid #333;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, border-color 0.2s;
    }

    #restart:hover {
      background: #2a2a2a;
      border-color: #555;
      transform: scale(1.05);
    }

    #score {
      display: flex;
      gap: 2.5rem;
      margin-top: 2rem;
      font-size: 1rem;
      color: #666;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .score-label { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; }
    .score-value { font-size: 2rem; font-weight: 800; }
    #score-x .score-value { color: #ff6b6b; }
    #score-tie .score-value { color: #888; }
    #score-o .score-value { color: #74c0fc; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status">X's turn</div>
  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>
  <button id="restart">Restart</button>
  <div id="score">
    <div class="score-box" id="score-x">
      <span class="score-label">X Wins</span>
      <span class="score-value" id="x-wins">0</span>
    </div>
    <div class="score-box" id="score-tie">
      <span class="score-label">Ties</span>
      <span class="score-value" id="ties">0</span>
    </div>
    <div class="score-box" id="score-o">
      <span class="score-label">O Wins</span>
      <span class="score-value" id="o-wins">0</span>
    </div>
  </div>

  <script>
    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board, current, over, scores;

    function init() {
      board = Array(9).fill(null);
      current = 'X';
      over = false;
      document.querySelectorAll('.cell').forEach(c => {
        c.textContent = '';
        c.className = 'cell';
      });
      setStatus(`${current}'s turn`);
    }

    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    function checkWin() {
      for (const [a,b,c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return [a,b,c];
        }
      }
      return null;
    }

    function handleClick(e) {
      const cell = e.currentTarget;
      const i = parseInt(cell.dataset.i);
      if (over || board[i]) return;

      board[i] = current;
      cell.textContent = current;
      cell.classList.add('taken', current.toLowerCase());

      const win = checkWin();
      if (win) {
        win.forEach(idx => document.querySelector(`[data-i="${idx}"]`).classList.add('win'));
        setStatus(`${current} wins!`);
        scores[current]++;
        document.getElementById(current === 'X' ? 'x-wins' : 'o-wins').textContent = scores[current];
        over = true;
        return;
      }

      if (board.every(Boolean)) {
        setStatus("It's a tie!");
        scores.tie++;
        document.getElementById('ties').textContent = scores.tie;
        over = true;
        return;
      }

      current = current === 'X' ? 'O' : 'X';
      setStatus(`${current}'s turn`);
    }

    scores = { X: 0, O: 0, tie: 0 };
    document.querySelectorAll('.cell').forEach(c => c.addEventListener('click', handleClick));
    document.getElementById('restart').addEventListener('click', init);
    init();
  </script>
</body>
</html>
